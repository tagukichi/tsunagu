<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: 印刷メニュー・料金表のサンプル画像。本番では支給画像（ACF）に差し替え。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-label="印刷メニュー・料金表（サンプル）">
  <rect width="760" height="520" rx="16" fill="#ffffff"/>
  <path d="M16 0h728a16 16 0 0 1 16 16v70H0V16A16 16 0 0 1 16 0z" fill="#7c3aed"/>
  <text x="40" y="54" font-family="'Noto Sans JP',sans-serif" font-size="30" font-weight="bold" fill="#ffffff">印刷メニュー・料金表（サンプル）</text>

  <g font-family="'Noto Sans JP',sans-serif">
    <!-- row 1 -->
    <text x="48" y="168" font-size="26" font-weight="bold" fill="#2a2f45">名刺作成パック</text>
    <text x="712" y="168" font-size="26" font-weight="bold" fill="#7c3aed" text-anchor="end">¥5,000〜</text>
    <text x="48" y="198" font-size="16" fill="#6b7280">片面/両面・100枚〜、データ入稿OK</text>
    <line x1="40" y1="224" x2="720" y2="224" stroke="#ece8f6" stroke-width="2"/>

    <!-- row 2 -->
    <text x="48" y="278" font-size="26" font-weight="bold" fill="#2a2f45">チラシ作成パック</text>
    <text x="712" y="278" font-size="26" font-weight="bold" fill="#7c3aed" text-anchor="end">¥15,000〜</text>
