    <line x1="40" y1="334" x2="720" y2="334" stroke="#ece8f6" stroke-width="2"/>

    <!-- row 3 -->
    <text x="48" y="388" font-size="26" font-weight="bold" fill="#2a2f45">毎月販促パック</text>
    <text x="712" y="388" font-size="26" font-weight="bold" fill="#7c3aed" text-anchor="end">¥30,000〜/月</text>
